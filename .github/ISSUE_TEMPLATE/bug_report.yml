name: 🐛 Bug Report
description: File a bug report to help us improve the application
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues first before submitting.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When I click the generate button...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce this behavior?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Browser / OS
      options:
        - Chrome / Chromium (Desktop)
        - Firefox (Desktop)
        - Safari (macOS / iOS)
        - Edge (Desktop)
        - Mobile Browser (Android / iOS)
        - Other
    validations:
      required: true
